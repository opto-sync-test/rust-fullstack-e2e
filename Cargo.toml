[package]
name = "opto-sync-rust-fullstack-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
opto-sync-client = { path = "vendor/opto-sync-clients/clients/rust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
